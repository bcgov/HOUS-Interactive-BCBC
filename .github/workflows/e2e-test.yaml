name: E2E Tests

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test]  # Add 'prod' when ready
    environment: ${{ matrix.environment }}

    # env:
    #   BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tests/HOUS-Interactive-BCBC-E2E-Tests/HOUS-Interactive-BCBC-2E2-Tests.csproj

      - name: Install Playwright browsers with deps
        run: pwsh tests/HOUS-Interactive-BCBC-E2E-Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run E2E tests - ${{ matrix.environment }}
        env:
          BASE_URL: https://${{ matrix.environment }}.buildingcode.gov.bc.ca
        run: dotnet test tests/HOUS-Interactive-BCBC-E2E-Tests/HOUS-Interactive-BCBC-2E2-Tests.csproj --no-build --results-directory TestResults  --logger "trx;LogFileName=test_results.trx"

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_id }}
          path: |
              TestResults/**/*.trx
              TestResults/**/*.html
