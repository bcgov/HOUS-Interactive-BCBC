{{- if .Values.route.enabled }}
{{- $secret := dict }}
{{- if .Values.route.tls.secretName }}
{{- $secret = (lookup "v1" "Secret" (.Values.namespace | default .Release.Namespace) .Values.route.tls.secretName) }}
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "interactive-bcbc-app.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "interactive-bcbc-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
    {{- if $secret }}
    {{- if hasKey $secret.data "tls.crt" }}
    certificate: |
{{ index $secret.data "tls.crt" | b64dec | indent 6 }}
    {{- end }}
    {{- if hasKey $secret.data "tls.key" }}
    key: |
{{ index $secret.data "tls.key" | b64dec | indent 6 }}
    {{- end }}
    {{- if hasKey $secret.data "ca.crt" }}
    caCertificate: |
{{ index $secret.data "ca.crt" | b64dec | indent 6 }}
    {{- end }}
    {{- end }}
  to:
    kind: Service
    name: {{ include "interactive-bcbc-app.fullname" . }}
    weight: 100
  wildcardPolicy: None
{{- end }}
