worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for non-root user (OpenShift compatibility)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Use the forwarded host from OpenShift router, not the internal host:port
        port_in_redirect off;
        absolute_redirect off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Case-insensitive image serving for graphics directories
        # Try both uppercase and lowercase extensions
        location ~ ^/(graphics|bc-graphics)/(.+)\.(jpg|jpeg|png|gif|eps|svg)$ {
            set $img_dir $1;
            set $img_path $2;
            set $img_ext $3;
            
            # Try original, then lowercase ext, then uppercase ext
            try_files 
                /$img_dir/$img_path.$img_ext
                /$img_dir/$img_path.jpg
                /$img_dir/$img_path.JPG
                /$img_dir/$img_path.jpeg
                /$img_dir/$img_path.JPEG
                /$img_dir/$img_path.png
                /$img_dir/$img_path.PNG
                /$img_dir/$img_path.gif
                /$img_dir/$img_path.GIF
                /$img_dir/$img_path.eps
                /$img_dir/$img_path.EPS
                /$img_dir/$img_path.svg
                /$img_dir/$img_path.SVG
                =404;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
